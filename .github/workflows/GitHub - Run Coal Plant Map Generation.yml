name: Run Map Generation

on:
  workflow_dispatch:      # Adds a manual "Run workflow" button inside GitHub for testing

jobs:
  run-r-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write     # Grants write permission to push changes back to the repository
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release' # Uses the latest stable release of R

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install Spatial System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libspatialindex-dev libgeos-dev libudunits2-dev

      - name: Install CRAN Packages
        run: |
          Rscript -e "install.packages(c('ggplot2', 'viridis', 'maps', 'mapproj', 'usmap', 'dplyr', 'tidyr', 'readxl', 'lubridate', 'usdata', 'data.table', 'purrr', 'leaflet', 'leaflegend', 'htmlwidgets', 'htmltools', 'foreign', 'base64enc', 'scales'))"

      - name: Run Map Generation Script
        run: Rscript "Code/GitHub - Generating Interactive Coal Plant Map.R" # Looks inside your Code folder for the script

      - name: Commit and Push Generated Map Back to Plots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add Plots/index.html
          git commit -m "Automated dashboard map sync" || echo "No changes to commit"
          git push
